  <style>
    * { box-sizing: border-box; }
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { opacity: 0.35; }
    .field-label { display: block; margin-bottom: 0.35rem; color: #334155; font-size: 0.76rem; font-weight: 800; }
    .field-input, .field-select, .field-textarea {
      width: 100%;
      border: 1px solid #cbd5e1;
      background: #fff;
      color: #0f172a;
      border-radius: 0.5rem;
      padding: 0.62rem 0.72rem;
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .field-textarea { min-height: 6.5rem; resize: vertical; }
    .field-input:focus, .field-select:focus, .field-textarea:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
    }
    .panel { border: 1px solid #e2e8f0; border-radius: 0.5rem; background: #fff; box-shadow: 0 10px 24px rgba(15, 23, 42, 0.05); }
    .metric { border: 1px solid #dbe3ef; border-radius: 0.5rem; background: #fff; padding: 1rem; }
    .nav-btn { border: 1px solid transparent; color: #475569; }
    .nav-btn.active { border-color: #93c5fd; background: #eff6ff; color: #1d4ed8; }
    .warning { border-color: #f59e0b; background: #fffbeb; color: #92400e; }
    .danger { border-color: #fca5a5; background: #fef2f2; color: #991b1b; }
    .success { border-color: #86efac; background: #f0fdf4; color: #166534; }
    @media print {
      .no-print { display: none !important; }
      body { background: #fff !important; padding: 0 !important; }
      #printReport { display: block !important; }
      #appShell { max-width: 100% !important; }
    }
  </style>

    function uid() {
      return Math.random().toString(36).slice(2, 9);
    }

    function toNumber(value, fallback = 0) {
      const parsed = Number(value);
      return Number.isFinite(parsed) ? parsed : fallback;
    }

    function clampZero(value) {
      return Math.max(0, toNumber(value, 0));
    }

    function fmt(value, digits = 2) {
      return toNumber(value, 0).toLocaleString("en-MY", { minimumFractionDigits: digits, maximumFractionDigits: digits });
    }

    function money(value) {
      return `RM ${fmt(value, 2)}`;
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
    }

    function icon(name, size = 16) {
      return `<i data-lucide="${name}" style="width:${size}px;height:${size}px" aria-hidden="true"></i>`;

      setText("headerCostLabel", t("Cost"));
      const languageSwitcher = document.getElementById("languageSwitcher");
      if (languageSwitcher) languageSwitcher.value = state.language;
      const eyebrow = document.querySelector("header p.uppercase");
      const title = document.querySelector("header h1");
      const subtitle = document.querySelector("header h1 + p");
      if (eyebrow) eyebrow.textContent = t("Research Prototype");
      if (title) title.textContent = t("AI-Driven Tile Installation Planning System");
      if (subtitle) subtitle.textContent = t("Whole-house tile estimating, mock AI room detection, material planning, duration prediction, and research evaluation.");

    function renderNav() {
      document.getElementById("topNav").innerHTML = pages.map(([id, label, iconName]) => `
        <button type="button" class="nav-btn ${state.activePage === id ? "active" : ""} flex shrink-0 items-center gap-2 rounded-lg px-3 py-2 text-sm font-extrabold" data-page="${id}" title="${t(label)}">
          ${icon(iconName)} <span>${t(label)}</span>
        </button>
      `).join("");
    }

    function renderHeaderMetrics() {
      const totals = calculateTotals();
      setText("headerTotalArea", `${fmt(totals.netArea)} m2`);
      setText("headerRoomCount", totals.roomCount);
      setText("headerTotalBoxes", totals.materials.tileBoxes);
      setText("headerTotalCost", money(totals.materials.totalMaterialCost));
    }

    function setText(id, value) {
      const el = document.getElementById(id);
      if (el) el.textContent = value;
    }

    function metric(label, value, hint = "", tone = "slate") {
      const colors = {
        slate: "text-slate-950",
        blue: "text-blue-700",
        green: "text-emerald-700",
        amber: "text-amber-700",
        red: "text-red-700"
      };
      const displayValue = typeof value === "string" ? t(value) : value;
      return `
        <div class="metric">
          <p class="text-xs font-black uppercase tracking-wide text-slate-500">${t(label)}</p>
          <p class="mt-2 text-2xl font-black ${colors[tone] || colors.slate}">${displayValue}</p>
          ${hint ? `<p class="mt-1 text-xs font-semibold text-slate-500">${t(hint)}</p>` : ""}
        </div>
      `;
    }

    function renderDashboard() {
      const totals = calculateTotals();
      const duration = calculateDuration(totals);
      const riskTone = duration.riskLevel === "High" ? "red" : duration.riskLevel === "Medium" ? "amber" : "green";
      return `
        <section class="space-y-5">
          <div class="grid gap-4 md:grid-cols-2 xl:grid-cols-4">
            ${metric("Total Project Area", `${fmt(totals.netArea)} m2`, `Gross ${fmt(totals.grossArea)} m2, deducted ${fmt(totals.deductedArea)} m2`, "blue")}
            ${metric("Number of Rooms", totals.roomCount, "Manual and imported AI rooms")}
            ${metric("Total Tile Pieces", totals.materials.tilePieces, "Includes waste percentage")}
            ${metric("Total Tile Boxes", totals.materials.tileBoxes, "Rounded up by pieces per box")}
            ${metric("Total Material Cost", money(totals.materials.totalMaterialCost), "Tiles, cement, sand, grout, adhesive, skirting", "green")}
            ${metric("Estimated Duration", `${fmt(duration.adjustedDuration, 1)} days`, `Base ${fmt(duration.baseDuration, 1)} days`, "blue")}
            ${metric("Risk Level", duration.riskLevel, "Uses labour, weather, and delivery factors", riskTone)}
            ${metric("Material Waste Percentage", `${fmt(state.settings.wastePercentage, 1)}%`, "Editable in material settings", "amber")}
          </div>

          <div class="grid gap-5 lg:grid-cols-[1.2fr_0.8fr]">
            <div class="panel p-4 sm:p-5">
              <div class="flex items-start justify-between gap-3">
                <div>
                  <h2 class="text-lg font-black text-slate-950">${t("Project Workflow")}</h2>
                  <p class="mt-1 text-sm font-semibold text-slate-500">${t("The prototype follows the research flow from plan upload to AI detection, manual correction, material estimation, duration prediction, and report generation.")}</p>
                </div>
                <button class="rounded-lg bg-blue-700 px-3 py-2 text-sm font-black text-white hover:bg-blue-800" data-page="upload">${icon("arrow-right")} ${t("Start Upload")}</button>
              </div>
              <div class="mt-5 grid gap-3 sm:grid-cols-3">
                ${workflowStep("1", "AI Detection", "Mock computer vision output creates room records with confidence and warnings.")}
                ${workflowStep("2", "Manual Correction", "Users can edit dimensions, shapes, obstacles, and tile assignments.")}
                ${workflowStep("3", "Research Output", "The report combines materials, schedule, risk, and accuracy evaluation.")}
              </div>
            </div>
            <div class="panel p-4 sm:p-5">
              <h2 class="text-lg font-black text-slate-950">${t("Validation Status")}</h2>
              <div class="mt-4 space-y-2">${renderValidationList(validateAll(totals))}</div>
            </div>
          </div>
        </section>
      `;
    }

    function workflowStep(num, title, body) {
      return `
        <div class="rounded-lg border border-slate-200 bg-slate-50 p-4">
          <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-blue-700 text-sm font-black text-white">${num}</div>
          <h3 class="mt-3 font-black text-slate-950">${t(title)}</h3>
          <p class="mt-1 text-sm font-semibold leading-6 text-slate-600">${t(body)}</p>
        </div>
      `;
    }

    function renderUpload() {
      const plan = state.uploadedPlan;
      return `
        <section class="space-y-5">
          ${pageTitle("Floor Plan Upload", "Upload JPG, PNG, PDF, or CAD-exported images. Images are previewed locally; PDFs show a mock preview message for this front-end prototype.")}
          <div class="grid gap-5 lg:grid-cols-[0.9fr_1.1fr]">
            <div class="panel p-4 sm:p-5">
              <label class="flex cursor-pointer flex-col items-center justify-center rounded-lg border-2 border-dashed border-blue-200 bg-blue-50 px-6 py-10 text-center hover:bg-blue-100">
                ${icon("upload-cloud", 38)}
                <span class="mt-3 text-base font-black text-blue-900">${t("Choose floor plan file")}</span>
                <span class="mt-1 text-sm font-semibold text-blue-700">${t("JPG, PNG, PDF, or exported CAD image")}</span>
                <input id="planUpload" class="hidden" type="file" accept=".jpg,.jpeg,.png,.pdf,image/*,application/pdf" />
              </label>
              ${plan ? `
                <div class="mt-4 rounded-lg border border-slate-200 bg-slate-50 p-4">
                  <p class="text-xs font-black uppercase text-slate-500">${t("Uploaded File")}</p>
                  <p class="mt-1 font-black text-slate-950">${escapeHtml(plan.name)}</p>
                  <p class="mt-1 text-sm font-semibold text-slate-600">${escapeHtml(plan.type || "Unknown type")} - ${fmt(plan.size / 1024, 1)} KB</p>
                </div>
              ` : ""}
            </div>
            <div class="panel overflow-hidden">
              <div class="border-b border-slate-200 px-4 py-3">
                <h3 class="font-black text-slate-950">${t("Preview")}</h3>
              </div>
              <div class="flex min-h-[22rem] items-center justify-center bg-slate-100 p-4">
                ${renderPlanPreview()}
              </div>
            </div>
          </div>
        </section>
      `;
    }

    function renderPlanPreview() {
      const plan = state.uploadedPlan;
      if (!plan) {
        return `<div class="text-center text-sm font-bold text-slate-500">${icon("image", 42)}<p class="mt-2">${t("No floor plan uploaded yet.")}</p></div>`;
      }
      if (plan.previewUrl) {
        return `<img src="${plan.previewUrl}" alt="Uploaded floor plan preview" class="max-h-[32rem] w-full rounded-lg object-contain" />`;
      }
      return `
        <div class="max-w-md rounded-lg border border-slate-300 bg-white p-6 text-center">
          ${icon("file-type", 44)}
          <h3 class="mt-3 font-black text-slate-950">${t("Mock PDF / CAD Preview")}</h3>
          <p class="mt-2 text-sm font-semibold leading-6 text-slate-600">${t("This prototype stores the uploaded file name and simulates plan analysis. A future backend can parse PDF pages or CAD exports before AI detection.")}</p>
        </div>
      `;
    }

    function renderAiDetection() {
      const results = state.aiDetectionResults;
      return `
        <section class="space-y-5">
          ${pageTitle("AI Room Detection", "Mock AI detection results simulate room segmentation, obstacle detection, confidence scoring, and warnings before manual correction.")}
          <div class="panel p-4 sm:p-5">
            <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
              <div>
                <h3 class="text-lg font-black text-slate-950">${t("Mock Detection Results")}</h3>
                <p class="mt-1 text-sm font-semibold text-slate-500">${state.uploadedPlan ? escapeHtml(state.uploadedPlan.name) : t("Please upload a floor plan image first")}</p>
              </div>
              <div class="flex flex-wrap gap-2">
                <button class="flex items-center gap-2 rounded-lg bg-blue-700 px-4 py-3 text-sm font-black text-white hover:bg-blue-800" data-action="run-ai">
                  ${icon("scan-search")} ${t("Run AI Detection")}
                </button>
                <button class="flex items-center gap-2 rounded-lg bg-slate-900 px-4 py-3 text-sm font-black text-white hover:bg-slate-700 ${results.length ? "" : "opacity-50"}" data-action="import-ai" ${results.length ? "" : "disabled"}>
                  ${icon("download")} ${t("Import AI Result to Rooms & Shapes")}
                </button>
              </div>
            </div>
            <div class="mt-4 rounded-lg border border-blue-100 bg-blue-50 p-3 text-sm font-bold leading-6 text-blue-900">
              mockAIAnalyzeFloorPlan() is the current front-end demo. Future integration point: POST /api/analyze-floor-plan, POST /api/detect-rooms, and POST /api/extract-room-crops should call a backend AI vision service.
            </div>
            ${results.length ? `
              <div class="mt-5 grid gap-4 lg:grid-cols-2">
                ${results.map(renderAiResultCard).join("")}
              </div>
            ` : `
              <div class="mt-5 rounded-lg border border-dashed border-slate-300 bg-slate-50 p-8 text-center text-sm font-bold text-slate-500">
                ${state.aiDetectionStatus === "running" ? t("AI detection completed") : t("Run AI Detection")}
              </div>
            `}
            ${state.mockAiImported ? `<div class="success mt-4 rounded-lg border p-3 text-sm font-bold">${t("AI result imported to Rooms & Shapes")}</div>` : ""}
          </div>
        </section>
      `;
    }

    function renderAiResultCard(row) {
      return `
        <article class="rounded-lg border border-slate-200 bg-white p-4">
          <div class="grid gap-4 sm:grid-cols-[10rem_1fr]">
            <div>
              ${row.cropImage ? `<img src="${row.cropImage}" alt="${escapeHtml(row.roomName)} cropped room image" class="h-32 w-full rounded-lg border border-slate-200 object-cover" />` : `<div class="flex h-32 items-center justify-center rounded-lg border border-dashed border-slate-300 bg-slate-50 p-3 text-center text-xs font-bold text-slate-500">${t("No cropped image available")}</div>`}
            </div>
            <div>
              <h4 class="text-base font-black text-slate-950">${escapeHtml(row.roomName || row.name)}</h4>
              <div class="mt-3 grid gap-2 text-sm sm:grid-cols-2">
                <p><b>${t("Room Type")}:</b> ${t(row.roomType)}</p>
                <p><b>${t("Detected Shape")}:</b> ${shapeLabel(row.shapeType)}</p>
                <p><b>${t("Gross Area")}:</b> ${fmt(row.grossArea)} m2</p>
                <p><b>${t("Deducted Area")}:</b> ${fmt(row.deductedArea)} m2</p>
                <p><b>${t("Net Tile Area")}:</b> ${fmt(row.netArea ?? Math.max(0, row.grossArea - row.deductedArea))} m2</p>
                <p><b>${t("Obstacle / Column Count")}:</b> ${(row.obstacles || []).length}</p>
                <p><b>${t("Confidence Score")}:</b> ${fmt(normalizeConfidence(row.confidence), 0)}%</p>
              </div>
              <p class="mt-3 rounded-lg bg-amber-50 p-3 text-sm font-bold text-amber-800">${escapeHtml(row.aiWarning || row.warning || "")}</p>
            </div>
          </div>
        </article>
      `;
    }

    function renderRooms() {
      const totals = calculateTotals();
      return `
        <section class="space-y-5">
          <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
            ${pageTitle("Manual Room Editor / Rooms & Shapes", "Edit room structure, shape-specific dimensions, tile scheme assignment, and non-tile deduction areas.")}
            <button class="flex items-center justify-center gap-2 rounded-lg bg-blue-700 px-4 py-3 text-sm font-black text-white hover:bg-blue-800" data-action="add-room">${icon("plus")} ${t("Add Room")}</button>
          </div>
          <div class="grid gap-4 md:grid-cols-3">
            ${metric("Gross Area", `${fmt(totals.grossArea)} m2`)}
            ${metric("Deducted Area", `${fmt(totals.deductedArea)} m2`, "Shape voids plus obstacles", "amber")}
            ${metric("Net Tile Area", `${fmt(totals.netArea)} m2`, "Never below zero", "blue")}
          </div>
          <div class="space-y-4">${state.rooms.map(renderRoomCard).join("")}</div>
        </section>
      `;
    }

    function renderRoomCard(room) {
      const calc = calculateRoom(room);
      return `
        <article class="panel p-4 sm:p-5" data-room-card="${room.id}">
          <div class="flex flex-col gap-3 lg:flex-row lg:items-start lg:justify-between">
            <div class="grid flex-1 gap-3 sm:grid-cols-2 lg:grid-cols-4">
              ${field("Room Name", `<input class="field-input" data-room="${room.id}" data-field="name" value="${escapeHtml(room.name)}" />`)}
              ${field("Room Type", selectHtml(roomTypes, room.roomType, `data-room="${room.id}" data-field="roomType"`))}
              ${field("Shape Type", selectHtml(shapeTypes, room.shapeType, `data-room="${room.id}" data-field="shapeType"`))}
              ${field("Assigned Tile Scheme", tileSelect(room.tileSchemeId, `data-room="${room.id}" data-field="tileSchemeId"`))}
            </div>
            <button class="rounded-lg border border-red-200 px-3 py-2 text-sm font-black text-red-700 hover:bg-red-50" data-action="delete-room" data-room-id="${room.id}" title="${t("Delete")}">${icon("trash-2")} ${t("Delete")}</button>
          </div>

          <div class="mt-4 grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
            ${numberField("Length / Main Length (m)", room.id, "length", room.length)}
            ${numberField("Width / Main Width (m)", room.id, "width", room.width)}
            ${shapeDimensionFields(room)}
          </div>

          <div class="mt-4 grid gap-3 lg:grid-cols-[12rem_1fr]">
            <div>
              ${room.cropImage ? `<img src="${room.cropImage}" alt="${escapeHtml(room.name)} cropped room image" class="h-36 w-full rounded-lg border border-slate-200 object-cover" />` : `<div class="flex h-36 items-center justify-center rounded-lg border border-dashed border-slate-300 bg-slate-50 p-3 text-center text-xs font-bold text-slate-500">${t("No cropped image available")}</div>`}
            </div>
            <div class="rounded-lg border border-slate-200 bg-slate-50 p-4 text-sm font-semibold leading-6 text-slate-600">
              <p><b>${t("Confidence Score")}:</b> ${room.aiConfidence ? `${fmt(normalizeConfidence(room.aiConfidence), 0)}%` : "-"}</p>
              <p><b>${t("AI Warning Message")}:</b> ${escapeHtml(room.aiWarning || "-")}</p>
            </div>
          </div>

          ${room.shapeType === "polygon" ? `
            <div class="mt-3">
              ${field("Polygon Points (x,y pairs in meters)", `<textarea class="field-textarea" data-room="${room.id}" data-field="polygonPoints" placeholder="0,0 4,0 4,3 2,4 0,3">${escapeHtml(room.polygonPoints)}</textarea>`)}
            </div>
          ` : ""}

          <div class="mt-4 grid gap-3 sm:grid-cols-2 lg:grid-cols-5">
            ${metric("Gross Area", `${fmt(calc.grossArea)} m2`)}
            ${metric("Deducted Area", `${fmt(calc.deductedArea)} m2`, "Shape cuts and non-tile areas", "amber")}
            ${metric("Net Tile Area", `${fmt(calc.netArea)} m2`, "", "blue")}
            ${metric("Perimeter", `${fmt(calc.perimeter)} m`)}
            ${metric("Skirting Length", `${fmt(calc.skirtingLength)} m`)}
          </div>

          <div class="mt-4 rounded-lg border border-slate-200 bg-slate-50 p-4">
            <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
              <div>
                <h4 class="font-black text-slate-950">${t("Non-Tile Deduction Areas")}</h4>
                <p class="text-sm font-semibold text-slate-500">${t("Columns, voids, staircases, fixed cabinets, island counters, and other obstacles are deducted from the gross area.")}</p>
              </div>
              <button class="rounded-lg bg-slate-900 px-3 py-2 text-sm font-black text-white hover:bg-slate-700" data-action="add-obstacle" data-room-id="${room.id}">${icon("plus")} ${t("Add Deduction")}</button>
            </div>
            <div class="mt-3 space-y-2">${room.obstacles.length ? room.obstacles.map(obs => renderObstacle(room, obs)).join("") : `<p class="text-sm font-bold text-slate-500">${t("No additional deduction areas.")}</p>`}</div>
          </div>

          ${calc.warning ? `<div class="warning mt-4 rounded-lg border p-3 text-sm font-bold">${calc.warning}</div>` : ""}
        </article>
      `;
    }

    function shapeDimensionFields(room) {
      if (room.shapeType === "l-shape" || room.shapeType === "column-cutout") {
        return `${numberField("Cutout Length (m)", room.id, "cutLength", room.cutLength)}${numberField("Cutout Width (m)", room.id, "cutWidth", room.cutWidth)}`;
      }
      if (room.shapeType === "u-shape") {
        return `${numberField("Inner Void Length (m)", room.id, "innerLength", room.innerLength)}${numberField("Inner Void Width (m)", room.id, "innerWidth", room.innerWidth)}`;
      }
      if (room.shapeType === "hollow") {
        return `${numberField("Hollow Length (m)", room.id, "hollowLength", room.hollowLength)}${numberField("Hollow Width (m)", room.id, "hollowWidth", room.hollowWidth)}`;
      }
      if (room.shapeType === "multiple-obstacles") {
        return `${numberField("Reference Length (m)", room.id, "cutLength", room.cutLength)}${numberField("Reference Width (m)", room.id, "cutWidth", room.cutWidth)}`;
      }
      return `${numberField("Optional Cut Length (m)", room.id, "cutLength", room.cutLength)}${numberField("Optional Cut Width (m)", room.id, "cutWidth", room.cutWidth)}`;
    }

    function renderObstacle(room, obs) {
      return `
        <div class="grid gap-2 rounded-lg border border-slate-200 bg-white p-3 sm:grid-cols-[1.4fr_1fr_1fr_1fr_auto]">
          ${field("Type", selectHtml(obstacleTypes, obs.type, `data-room="${room.id}" data-obstacle="${obs.id}" data-field="type"`))}
          ${field("Length (m)", `<input class="field-input" type="number" min="0" step="0.01" data-room="${room.id}" data-obstacle="${obs.id}" data-field="length" value="${obs.length}" />`)}
          ${field("Width (m)", `<input class="field-input" type="number" min="0" step="0.01" data-room="${room.id}" data-obstacle="${obs.id}" data-field="width" value="${obs.width}" />`)}
          ${field("Area (m2)", `<input class="field-input" type="number" min="0" step="0.01" data-room="${room.id}" data-obstacle="${obs.id}" data-field="area" value="${obs.area ?? ""}" placeholder="${fmt(clampZero(obs.length) * clampZero(obs.width))}" />`)}
          <button class="self-end rounded-lg border border-red-200 px-3 py-2 text-sm font-black text-red-700 hover:bg-red-50" data-action="delete-obstacle" data-room-id="${room.id}" data-obstacle-id="${obs.id}" title="Remove deduction">${icon("trash-2")}</button>
        </div>
      `;
    }

      const totals = calculateTotals();
      return `
        <section class="space-y-5">
          <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">

            <button class="flex items-center justify-center gap-2 rounded-lg bg-blue-700 px-4 py-3 text-sm font-black text-white hover:bg-blue-800" data-action="add-tile">${icon("plus")} ${t("Add Tile Scheme")}</button>
          </div>

          <div class="panel p-4 sm:p-5">
            <h3 class="text-lg font-black text-slate-950">${t("Global Calculation Settings")}</h3>
            <div class="mt-4 grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
              ${settingsNumber("Grout Joint (mm)", "groutJointMm", state.settings.groutJointMm, 0, 0.1)}
              ${settingsNumber("Waste Percentage (%)", "wastePercentage", state.settings.wastePercentage, 0, 0.1)}

              <div class="flex items-end gap-2">

                <button class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm font-black hover:bg-slate-50" data-action="set-waste" data-value="15">${t("Diagonal 15%")}</button>

          </div>

          <div class="panel p-4 sm:p-5">
            <h3 class="text-lg font-black text-slate-950">${t("Material Consumption and Cost Rates")}</h3>
            <div class="mt-4 grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
              ${settingsNumber("Cement Bags per m2", "cementBagsPerM2", state.settings.cementBagsPerM2, 0, 0.01)}
              ${settingsNumber("Sand m3 per m2", "sandM3PerM2", state.settings.sandM3PerM2, 0, 0.01)}
              ${settingsNumber("Adhesive kg per m2", "adhesiveKgPerM2", state.settings.adhesiveKgPerM2, 0, 0.1)}

              ${settingsNumber("Adhesive consumption adjustment factor", "adhesiveAdjustmentFactor", state.settings.adhesiveAdjustmentFactor, 1, 0.01)}

              ${settingsNumber("Cement Cost / Bag", "cementCostPerBag", state.settings.cementCostPerBag, 0, 0.1)}
              ${settingsNumber("Sand Cost / m3", "sandCostPerM3", state.settings.sandCostPerM3, 0, 0.1)}

              ${settingsNumber("Adhesive Cost / kg", "adhesiveCostPerKg", state.settings.adhesiveCostPerKg, 0, 0.1)}
              ${settingsNumber("Grout Cost / kg", "groutCostPerKg", state.settings.groutCostPerKg, 0, 0.1)}
              ${settingsNumber("Skirting Cost / m", "skirtingCostPerM", state.settings.skirtingCostPerM, 0, 0.1)}
            </div>
            <div class="mt-4 rounded-lg border border-emerald-200 bg-emerald-50 p-3 text-sm font-bold leading-6 text-emerald-900">
              ${t("Material assumption is based on interview data: 1 bag of 50kg tile adhesive covers approximately 80-83 sq ft, or about 7.43-7.71 m2 under standard flat conditions.")}
            </div>
          </div>

          <div class="grid gap-4 lg:grid-cols-2">${state.tileSchemes.map(renderTileCard).join("")}</div>

          <div class="grid gap-4 md:grid-cols-4">
            ${metric("Tile Cost", money(totals.materials.tileCost), "From scheme box prices", "green")}

    function selectHtml(options, selected, attrs) {

    function shapeLabel(value) {
      return t(shapeTypes.find(s => s[0] === value)?.[1] || "Standard Rectangle");
    }

    function shapeValue(label) {
      return shapeTypes.find(s => s[1] === label || s[0] === label)?.[0] || "rectangle";
    }

    function calculateRoom(room) {
      const length = clampZero(room.length);
      const width = clampZero(room.width);
      let grossArea = length * width;
      let shapeDeducted = 0;
      let perimeter = 2 * (length + width);
      const warningMessages = [];

      if (room.shapeType === "polygon") {
        const polygon = calculatePolygon(room.polygonPoints);
        if (polygon.area > 0) {
          grossArea = polygon.area;
          perimeter = polygon.perimeter;
        } else {
          warningMessages.push("Polygon points are invalid; fallback length x width area is used.");
        }
      }

      if (room.shapeType === "l-shape" || room.shapeType === "column-cutout") {
        shapeDeducted += clampZero(room.cutLength) * clampZero(room.cutWidth);
      }
      if (room.shapeType === "u-shape") {
        shapeDeducted += clampZero(room.innerLength) * clampZero(room.innerWidth);
      }
      if (room.shapeType === "hollow") {
        shapeDeducted += clampZero(room.hollowLength) * clampZero(room.hollowWidth);
      }

      const obstacleDeducted = room.obstacles.reduce((sum, obs) => sum + (clampZero(obs.area) || clampZero(obs.length) * clampZero(obs.width)), 0);
      const deductedArea = shapeDeducted + obstacleDeducted;
      if (deductedArea >= grossArea && grossArea > 0) {
        warningMessages.push("Deducted area is greater than or equal to gross area. Net tile area is capped at 0.");
      }
      if (length < 0 || width < 0) warningMessages.push("Room length and width cannot be negative.");

      const netArea = Math.max(0, grossArea - deductedArea);
      const doorDeduction = state.settings.defaultDoorWidth || 0;
      const skirtingLength = Math.max(0, perimeter - doorDeduction);

      return { grossArea, shapeDeducted, obstacleDeducted, deductedArea, netArea, perimeter, skirtingLength, warning: warningMessages.join(" ") };
    }

    function calculatePolygon(pointsText) {
      const points = String(pointsText || "").trim().split(/\s+/).map(pair => {
        const [x, y] = pair.split(",").map(Number);
        return Number.isFinite(x) && Number.isFinite(y) ? { x, y } : null;
      }).filter(Boolean);
      if (points.length < 3) return { area: 0, perimeter: 0 };
      let area = 0;
      let perimeter = 0;
      for (let i = 0; i < points.length; i++) {
        const current = points[i];
        const next = points[(i + 1) % points.length];
        area += current.x * next.y - next.x * current.y;
        perimeter += Math.hypot(next.x - current.x, next.y - current.y);
      }
      return { area: Math.abs(area / 2), perimeter };
    }

    function calculateTotals() {
      const roomCalcs = state.rooms.map(room => ({ room, calc: calculateRoom(room) }));
      const grossArea = roomCalcs.reduce((sum, item) => sum + item.calc.grossArea, 0);
      const deductedArea = roomCalcs.reduce((sum, item) => sum + item.calc.deductedArea, 0);
      const netArea = roomCalcs.reduce((sum, item) => sum + item.calc.netArea, 0);
      const skirtingLength = roomCalcs.reduce((sum, item) => sum + item.calc.skirtingLength, 0);
      return { grossArea, deductedArea, netArea, skirtingLength, roomCount: state.rooms.length, roomCalcs, materials: calculateMaterials(roomCalcs, netArea, skirtingLength) };
    }

    function calculateMaterials(roomCalcs, netArea, skirtingLength) {
      let tilePieces = 0;
      let tileBoxes = 0;
      let tileCost = 0;
      const groutMeters = clampZero(state.settings.groutJointMm) / 1000;
      const wasteMultiplier = 1 + clampZero(state.settings.wastePercentage) / 100;

      roomCalcs.forEach(({ room, calc }) => {
        const tile = state.tileSchemes.find(t => t.id === room.tileSchemeId) || state.tileSchemes[0];
        if (!tile || tile.length <= 0 || tile.width <= 0 || tile.piecesPerBox <= 0) return;
        const effectiveTileArea = (clampZero(tile.length) + groutMeters) * (clampZero(tile.width) + groutMeters);
        const roomPieces = Math.ceil((calc.netArea * wasteMultiplier) / effectiveTileArea);
        const roomBoxes = Math.ceil(roomPieces / clampZero(tile.piecesPerBox));
        tilePieces += roomPieces;
        tileBoxes += roomBoxes;
        tileCost += roomBoxes * clampZero(tile.costPerBox);
      });

      const cementBags = Math.ceil(netArea * clampZero(state.settings.cementBagsPerM2));
      const sandVolume = netArea * clampZero(state.settings.sandM3PerM2);
      const adhesiveKg = netArea * clampZero(state.settings.adhesiveKgPerM2);
      const adhesiveCoverage = Math.max(0.01, clampZero(state.settings.adhesiveCoveragePerBag || 7.43));
      const adhesiveBags = Math.ceil((netArea / adhesiveCoverage) * Math.max(1, clampZero(state.settings.thicknessFactor || 1)) * Math.max(1, clampZero(state.settings.adhesiveAdjustmentFactor || 1)));
      const groutKg = netArea * clampZero(state.settings.groutKgPerM2);
      const skirtingCost = skirtingLength * clampZero(state.settings.skirtingCostPerM);
      const cementCost = cementBags * clampZero(state.settings.cementCostPerBag);
      const sandCost = sandVolume * clampZero(state.settings.sandCostPerM3);
      const adhesiveCost = adhesiveKg * clampZero(state.settings.adhesiveCostPerKg);
      const adhesiveBagCost = adhesiveBags * clampZero(state.settings.adhesiveCostPerBag);
      const groutCost = groutKg * clampZero(state.settings.groutCostPerKg);
      const totalMaterialCost = tileCost + cementCost + sandCost + adhesiveCost + adhesiveBagCost + groutCost + skirtingCost;

      return { tilePieces, tileBoxes, tileCost, cementBags, sandVolume, adhesiveKg, adhesiveBags, groutKg, skirtingLength, skirtingCost, cementCost, sandCost, adhesiveCost, adhesiveBagCost, groutCost, totalMaterialCost };
    }

    function calculateWeatherRisk() {
      const w = state.weather;
      const isOutdoor = w.projectType === "Outdoor";
      const isMixed = w.projectType === "Mixed";
      const rainfallByLevel = { Low: 5, Medium: 12, High: 25 };
      const rainfallImpact = rainfallByLevel[w.rainfallLevel] ?? (clampZero(w.rainfall) > 60 ? 25 : clampZero(w.rainfall) > 25 ? 12 : 5);
      const humidityImpact = clampZero(w.humidity) > 80 ? 8 : clampZero(w.humidity) > 65 ? 4 : 1;
      const temperatureImpact = clampZero(w.temperature) > 34 ? 7 : clampZero(w.temperature) > 30 ? 3 : 0;
      const exposure = isOutdoor ? 1 : isMixed ? 0.65 : 0.35;
      const weatherDelayPercent = (rainfallImpact + humidityImpact + temperatureImpact) * exposure;
      const workforceRiskPercent = clampZero(w.workerAbsenceProbability) + clampZero(w.sickLeaveProbability) + clampZero(w.publicHolidayImpact) * 0.5;
      const materialRiskPercent = clampZero(w.materialShortageRisk) + Math.max(0, 100 - clampZero(w.siteStockAvailability)) * 0.4;
      const equipmentRiskPercent = clampZero(w.equipmentFailureRisk);
      const overallDelayRisk = weatherDelayPercent + workforceRiskPercent * 0.45 + materialRiskPercent * 0.45 + equipmentRiskPercent * 0.35;
      const weatherFactor = 1 + overallDelayRisk / 100;
      const level = overallDelayRisk > 28 ? "High" : overallDelayRisk > 14 ? "Medium" : "Low";
      const messages = [];
      if (w.rainfallLevel === "High" || w.rainfall > 40) messages.push(state.language === "zh" ? "降雨风险较高；室外铺贴可能停工，材料配送也需要预留缓冲。" : "Rainfall risk is high; outdoor tiling may pause and material delivery should include buffer time.");
      if (w.humidity > 75) messages.push(state.language === "zh" ? "湿度较高；填缝剂和瓷砖胶的干燥或固化时间可能增加。" : "Humidity is high; drying or curing time may increase, especially for grout and adhesive.");
      if (w.temperature > 32) messages.push(state.language === "zh" ? "温度较高；长时间施工时工人效率可能下降。" : "Temperature is high; worker productivity may decrease during long shifts.");
      if (!isOutdoor) messages.push(state.language === "zh" ? "室内项目可降低直接天气影响，但运输和配送仍可能影响进度。" : "Indoor project type reduces direct weather impact, but transport and delivery can still affect the schedule.");
      if (isOutdoor) messages.push(state.language === "zh" ? "室外项目更容易受到降雨和温度影响。" : "Outdoor project type increases exposure to rainfall and temperature risks.");
      if (materialRiskPercent > 18) messages.push(state.language === "zh" ? "材料供应风险偏高；建议提前采购并确认工地库存。" : "Material supply risk is elevated; procure earlier and confirm site stock before installation begins.");
      if (equipmentRiskPercent > 10) messages.push(state.language === "zh" ? "设备故障风险偏高；建议准备备用工具。" : "Equipment failure risk is elevated; prepare backup tools.");
      if (!messages.length) messages.push(state.language === "zh" ? "当前模拟条件下风险较低。" : "Weather and delay risk are low under the current simulated conditions.");
      return { weatherFactor, weatherImpactPercent: weatherDelayPercent, weatherDelayPercent, workforceRiskPercent, materialRiskPercent, equipmentRiskPercent, overallDelayRisk, level, messages };
    }

    function calculateDuration(totals = calculateTotals()) {
      const l = state.labour;
      const weather = calculateWeatherRisk();
      const workers = Math.max(1, Math.floor(clampZero(l.workers)));
      const productivity = Math.max(0.01, clampZero(l.productivity));
      const teamProductivity = Math.max(0.01, clampZero(l.teamProductivity) || workers * productivity);
      const autoComplexity = calculateAutoComplexityFactor(totals);
      const baseDuration = totals.netArea / Math.max(0.01, workers * productivity);
      const manualFactors = Math.max(1, clampZero(l.complexityFactor || 1)) * Math.max(1, clampZero(l.cuttingFactor || 1)) * Math.max(1, clampZero(l.obstacleFactor || 1));
      const riskFactor = Math.max(1, clampZero(l.workerAbsenceRiskFactor || 1)) * Math.max(1, clampZero(l.materialSupplyFactor || 1)) * Math.max(1, clampZero(l.equipmentFactor || 1)) * Math.max(1, clampZero(l.publicHolidayFactor || 1));
      const adjustedDuration = baseDuration * manualFactors * autoComplexity * Math.max(1, clampZero(l.weatherDelayFactor || 1)) * weather.weatherFactor * riskFactor;
      const bufferDays = Math.ceil(adjustedDuration * (durationRiskBufferPercent(weather.level, riskFactor) / 100) * 10) / 10;
      const finalDuration = adjustedDuration + bufferDays;
      const recommendedWorkers = Math.max(1, Math.ceil(totals.netArea / (10 * productivity)));
      const labourCost = finalDuration * workers * clampZero(l.dailyWorkerCost);
      const riskScore = adjustedDuration / Math.max(1, baseDuration);
      const riskLevel = riskScore > 1.75 || weather.level === "High" ? "High" : riskScore > 1.35 || weather.level === "Medium" ? "Medium" : "Low";
      const summary = state.language === "zh"
        ? `访谈基准为 2 人团队每日约 39.95-44.59 平方米，默认平均 ${fmt(teamProductivity, 2)} 平方米/天。当前 ${workers} 名工人、每人每日 ${fmt(productivity, 2)} 平方米，基础工期 ${fmt(baseDuration, 1)} 天；考虑复杂度、切割、柱位/障碍物、天气、人力、材料、设备和假期因素后，最终预计工期为 ${fmt(finalDuration, 1)} 天。`
        : `Interview baseline: a 2-person team completes about 39.95-44.59 m2/day, with ${fmt(teamProductivity, 2)} m2/day used as the default average. With ${workers} workers at ${fmt(productivity, 2)} m2 per worker per day, the base duration is ${fmt(baseDuration, 1)} days. After complexity, cutting, column/obstacle, weather, workforce, material, equipment, and holiday factors, final estimated duration is ${fmt(finalDuration, 1)} days.`;
      return { baseDuration, adjustedDuration, bufferDays, finalDuration, recommendedWorkers, labourCost, riskLevel, summary, weatherImpactPercent: weather.weatherImpactPercent, autoComplexity };
    }

    function calculateAutoComplexityFactor(totals = calculateTotals()) {
      const irregularRooms = totals.roomCalcs.filter(({ room }) => ["polygon", "hollow", "multiple-obstacles", "u-shape"].includes(room.shapeType)).length;
      const obstacleCount = state.rooms.reduce((sum, room) => sum + room.obstacles.length, 0);
      const deductionRatio = totals.grossArea ? totals.deductedArea / totals.grossArea : 0;
      return 1 + irregularRooms * 0.03 + obstacleCount * 0.015 + Math.min(0.2, deductionRatio);
    }

    function durationRiskBufferPercent(weatherLevel, riskFactor) {
      return (weatherLevel === "High" ? 18 : weatherLevel === "Medium" ? 10 : 5) + Math.max(0, (riskFactor - 1) * 20);
    }

    function calculateAccuracy() {
      const a = state.accuracy;
      const warning = [];
      const materialActual = clampZero(a.actualMaterialUsed);
      const durationActual = clampZero(a.actualDuration);
      const manualTime = clampZero(a.manualCalculationTime);
      if (materialActual === 0) warning.push("Actual material cannot be 0.");
      if (durationActual === 0) warning.push("Actual duration cannot be 0.");
      if (manualTime === 0) warning.push("Manual calculation time cannot be 0.");
      const aiMaterialError = materialActual ? Math.abs(a.aiEstimatedMaterial - materialActual) / materialActual * 100 : 0;
      const manualMaterialError = materialActual ? Math.abs(a.manualEstimatedMaterial - materialActual) / materialActual * 100 : 0;
      const aiDurationError = durationActual ? Math.abs(a.aiEstimatedDuration - durationActual) / durationActual * 100 : 0;
      const manualDurationError = durationActual ? Math.abs(a.manualEstimatedDuration - durationActual) / durationActual * 100 : 0;
      const timeSaving = manualTime ? (a.manualCalculationTime - a.aiCalculationTime) / manualTime * 100 : 0;
      const aiAverage = (aiMaterialError + aiDurationError) / 2;
      const manualAverage = (manualMaterialError + manualDurationError) / 2;
      return {
        aiMaterialError,
        manualMaterialError,
        aiDurationError,
        manualDurationError,
        timeSaving,
        moreAccurate: aiAverage <= manualAverage ? "AI Estimation" : "Manual Estimation",
        faster: a.aiCalculationTime <= a.manualCalculationTime ? "AI Method" : "Manual Method",
        warning: warning.join(" ")
      };
    }

    function validateTile(tile) {
      const messages = [];
      if (tile.length <= 0 || tile.width <= 0) messages.push("Tile length and width must be greater than 0.");
      if (tile.piecesPerBox <= 0) messages.push("Pieces per box must be greater than 0.");
      if (tile.costPerBox < 0) messages.push("Cost cannot be negative.");
      return messages.join(" ");
    }

    function validateAll(totals = calculateTotals()) {
      const messages = [];
      state.tileSchemes.forEach(tile => {
        const tileMessage = validateTile(tile);
        if (tileMessage) messages.push(`${tile.name}: ${tileMessage}`);
      });
      state.rooms.forEach(room => {
        const calc = calculateRoom(room);
        if (calc.warning) messages.push(`${room.name}: ${calc.warning}`);
        if (room.length < 0 || room.width < 0) messages.push(`${room.name}: room length / width cannot be less than 0.`);
      });
      if (state.labour.workers <= 0) messages.push("Worker number must be greater than 0.");
      if (state.labour.productivity <= 0) messages.push("Productivity must be greater than 0.");
      const accuracy = calculateAccuracy();
      if (accuracy.warning) messages.push(`Accuracy Evaluation: ${accuracy.warning}`);
      if (totals.materials.totalMaterialCost < 0) messages.push("Cost cannot be negative.");
      return messages;
    }

    function renderValidationList(messages) {
      if (!messages.length) return `<div class="success rounded-lg border p-3 text-sm font-bold">${t("All current inputs pass validation.")}</div>`;
      return messages.map(msg => `<div class="danger rounded-lg border p-3 text-sm font-bold">${escapeHtml(msg)}</div>`).join("");

    function generateSuggestions(totals, duration, weather) {
      const suggestions = [];
      const zh = state.language === "zh";
      const aiRows = state.aiDetectionResults.length ? state.aiDetectionResults : mockAiRooms;
      aiRows.forEach(row => {
        if (normalizeConfidence(row.confidence) < 80) suggestions.push(zh ? `${row.roomName || row.name} 的 AI 置信度低于 80%，建议人工复查图纸。` : `${row.roomName || row.name} has AI confidence below 80%; manually review the drawing.`);
      });
      if (state.settings.wastePercentage > 12) suggestions.push(zh ? "损耗百分比较高；建议优化排砖或减少复杂斜切。" : "Waste percentage is high; optimize tile layout or reduce complex diagonal cutting where possible.");
      if (totals.materials.adhesiveBags > Math.ceil(totals.netArea / Math.max(0.01, state.settings.adhesiveCoveragePerBag || 7.43)) * 1.2) suggestions.push(zh ? "瓷砖胶包数偏高；可能是地面不平整或厚度系数设置较高。" : "Adhesive bags are elevated; this may indicate uneven floor conditions or a high thickness factor.");
      if (duration.finalDuration > 12) suggestions.push(zh ? "最终工期较长；建议增加工人人数或调整施工分区顺序。" : "Final duration is long; increase worker count or split work zones to improve productivity.");
      if (duration.riskLevel === "High") suggestions.push(zh ? "风险等级较高；建议预留缓冲天数并准备替代施工计划。" : "Risk level is high; reserve buffer days and prepare alternate schedule options.");
      if (weather.level !== "Low") suggestions.push(zh ? "天气或延误风险明显；室外工作和材料配送应避开高降雨或高湿时段。" : "Weather or delay risk is significant; adjust outdoor work and delivery timing around rainfall or humidity.");
      if (weather.materialRiskPercent > 18) suggestions.push(zh ? "材料短缺风险较高；建议提前安排采购。" : "Material shortage risk is high; arrange procurement earlier.");
      if (weather.equipmentRiskPercent > 10) suggestions.push(zh ? "设备故障风险较高；建议准备备用工具。" : "Equipment failure risk is high; prepare backup tools.");
      totals.roomCalcs.forEach(({ room, calc }) => {
        if (calc.grossArea > 0 && calc.deductedArea / calc.grossArea > 0.2) suggestions.push(zh ? `${room.name} 的扣除面积比例较高；建议确认柱位或障碍物识别是否正确。` : `${room.name} has a large deducted-area ratio; manually review the floor plan and obstacle measurements.`);
        if (room.shapeType === "polygon") suggestions.push(zh ? `${room.name} 是不规则 / 多边形房间；建议预留更高损耗百分比。` : `${room.name} is an irregular / polygon room; reserve a higher waste percentage.`);
      });
      if (!suggestions.length) suggestions.push(zh ? "当前项目输入较稳定；最终采购前仍建议人工复核。" : "Current project inputs are stable; continue with manual review before final procurement.");
      return suggestions;
    }

    function updateRoomField(target) {
      const room = state.rooms.find(r => r.id === target.dataset.room);
      if (!room) return;
      const fieldName = target.dataset.field;
      if (fieldName === "shapeTypeLabel") {
        room.shapeType = shapeValue(target.value);
      } else if (["name", "roomType", "shapeType", "tileSchemeId", "polygonPoints"].includes(fieldName)) {
        room[fieldName] = target.value;
      } else {
        room[fieldName] = toNumber(target.value, 0);
      }
    }

    function updateObstacleField(target) {
      const room = state.rooms.find(r => r.id === target.dataset.room);
      const obs = room?.obstacles.find(o => o.id === target.dataset.obstacle);
      if (!obs) return;
      obs[target.dataset.field] = target.dataset.field === "type" ? target.value : toNumber(target.value, 0);
    }

    function updateTileField(target) {
      const tile = state.tileSchemes.find(t => t.id === target.dataset.tile);
      if (!tile) return;
      tile[target.dataset.field] = target.dataset.field === "name" ? target.value : toNumber(target.value, 0);
    }

    function addRoom() {
      state.rooms.push({
        id: uid(),
        name: `Room ${state.rooms.length + 1}`,
        roomType: "Others",
        shapeType: "rectangle",
        tileSchemeId: state.tileSchemes[0]?.id || "",
        length: 3,
        width: 3,
        cutLength: 0,
        cutWidth: 0,
        innerLength: 0,
        innerWidth: 0,
        hollowLength: 0,
        hollowWidth: 0,
        polygonPoints: "0,0 3,0 3,3 0,3",
        obstacles: []
      });
      showToast(t("Room added"));
    }

    function deleteRoom(roomId) {
      state.rooms = state.rooms.filter(room => room.id !== roomId);
      showToast(t("Room deleted"));
    }

    function addObstacle(roomId) {
      const room = state.rooms.find(r => r.id === roomId);
      if (!room) return;
      room.obstacles.push({ id: uid(), type: "Column", length: 0.5, width: 0.5 });
    }

    function deleteObstacle(roomId, obstacleId) {
      const room = state.rooms.find(r => r.id === roomId);
      if (!room) return;
      room.obstacles = room.obstacles.filter(obs => obs.id !== obstacleId);
    }

    function addTile() {
      state.tileSchemes.push({ id: uid(), name: `Tile Scheme ${state.tileSchemes.length + 1}`, length: 0.6, width: 0.6, piecesPerBox: 4, costPerBox: 55 });
      showToast(t("Tile scheme added"));
    }

    function deleteTile(tileId) {
      if (state.tileSchemes.length <= 1) return;
      state.tileSchemes = state.tileSchemes.filter(tile => tile.id !== tileId);
      state.rooms.forEach(room => {
        if (room.tileSchemeId === tileId) room.tileSchemeId = state.tileSchemes[0].id;
      });
      showToast(t("Tile scheme deleted"));
    }

    function importAiResults() {
      const sourceRows = state.aiDetectionResults.length ? state.aiDetectionResults : mockAiRooms;
      const importedRooms = sourceRows.map(row => {
        const width = Math.sqrt(row.grossArea);
        const length = row.grossArea / width;
        const obstacleRows = Array.isArray(row.obstacles) ? row.obstacles : Array.from({ length: row.obstacles || 0 }, (_, index) => ({ type: index === 0 ? "Column" : "Other Obstacle", area: (row.deductedArea || 0) / Math.max(1, row.obstacles || 1) }));
        return {
          id: uid(),
          name: row.roomName || row.name,
          roomType: row.roomType,
          shapeType: row.shapeType,
          tileSchemeId: state.tileSchemes[0]?.id || "",
          length: Number(length.toFixed(2)),
          width: Number(width.toFixed(2)),
          cutLength: row.shapeType === "l-shape" ? 1.2 : 0,
          cutWidth: row.shapeType === "l-shape" ? 0.8 : 0,
          innerLength: row.shapeType === "u-shape" ? 1 : 0,
          innerWidth: row.shapeType === "u-shape" ? 1 : 0,
          hollowLength: row.shapeType === "hollow" ? 0.8 : 0,
          hollowWidth: row.shapeType === "hollow" ? 0.75 : 0,
          polygonPoints: "0,0 4,0 4,3 2,4 0,3",
          aiGrossArea: row.grossArea,
          aiDeductedArea: row.deductedArea,
          aiNetArea: row.netArea ?? Math.max(0, row.grossArea - row.deductedArea),
          aiConfidence: row.confidence,
          aiWarning: row.aiWarning || row.warning || "",
          bbox: row.bbox,
          cropImage: row.cropImage || "",
          obstacles: obstacleRows.map((obs, index) => ({ id: uid(), type: obs.type || (index === 0 ? "Column" : "Other Obstacle"), length: 0.45, width: Math.max(0.3, clampZero(obs.area ?? row.deductedArea / Math.max(1, obstacleRows.length)) / 0.45) }))
        };
      });
      state.rooms = [...state.rooms, ...importedRooms];
      state.mockAiImported = true;
      state.activePage = "rooms";
      showToast(t("AI result imported to Rooms & Shapes"));
    }

    function handlePlanUpload(file) {
      if (!file) return;
      if (state.uploadedPlan?.previewUrl) URL.revokeObjectURL(state.uploadedPlan.previewUrl);
      const isImage = file.type.startsWith("image/");
      state.uploadedPlan = {
        name: file.name,
        type: file.type || "Unknown",
        size: file.size,
        previewUrl: isImage ? URL.createObjectURL(file) : "",
        isImage
      };
      state.aiDetectionResults = [];
      state.mockAiImported = false;
      renderApp();
    }

    async function runAiDetection() {
      if (!state.uploadedPlan) {
        showToast(t("Please upload a floor plan image first"));
        state.activePage = "upload";
        renderApp();
        return;
      }
      state.aiDetectionStatus = "running";
      renderApp();
      const detected = mockAIAnalyzeFloorPlan(state.uploadedPlan);
      if (state.uploadedPlan.previewUrl) {
        try {
          const imageElement = await loadImageElement(state.uploadedPlan.previewUrl);
          state.aiDetectionResults = detected.map(room => ({
            ...room,
            cropImage: cropRoomImageFromPlan(imageElement, room.bbox)
          }));
        } catch {
          state.aiDetectionResults = detected.map(room => ({ ...room, cropImage: "" }));
        }
      } else {
        state.aiDetectionResults = detected.map(room => ({ ...room, cropImage: "" }));
      }
      state.aiDetectionStatus = "completed";
      showToast(t("AI detection completed"));
      renderApp();
    }

    function mockAIAnalyzeFloorPlan(uploadedPlan) {
      // Future API integration point: replace this mock with POST /api/analyze-floor-plan
      // and POST /api/detect-rooms from a backend that owns the real AI vision model key.
      return mockAiRooms.map(room => ({
        ...room,
        sourceFileName: uploadedPlan?.name || "",
        netArea: Math.max(0, room.grossArea - room.deductedArea)
      }));
    }

    function loadImageElement(src) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = reject;
        image.src = src;
      });
    }

    function cropRoomImageFromPlan(imageElement, bbox) {
      if (!imageElement || !bbox) return "";
      const naturalWidth = imageElement.naturalWidth || imageElement.width;
      const naturalHeight = imageElement.naturalHeight || imageElement.height;
      if (!naturalWidth || !naturalHeight) return "";
      const designWidth = 640;
      const designHeight = 520;
      const scaleX = naturalWidth / designWidth;
      const scaleY = naturalHeight / designHeight;
      const sx = Math.max(0, Math.min(naturalWidth - 1, bbox.x * scaleX));
      const sy = Math.max(0, Math.min(naturalHeight - 1, bbox.y * scaleY));
      const sw = Math.max(1, Math.min(naturalWidth - sx, bbox.width * scaleX));
      const sh = Math.max(1, Math.min(naturalHeight - sy, bbox.height * scaleY));
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(sw));
      canvas.height = Math.max(1, Math.round(sh));
      const ctx = canvas.getContext("2d");
      ctx.drawImage(imageElement, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL("image/png");
    }

    function normalizeConfidence(value) {
      const confidence = clampZero(value);
      return confidence <= 1 ? confidence * 100 : confidence;
    }

    async function copySummary() {
      const totals = calculateTotals();
      const duration = calculateDuration(totals);
      const text = state.language === "zh"
        ? `瓷砖项目摘要：净铺贴面积 ${fmt(totals.netArea)} m2，${totals.roomCount} 个房间，${totals.materials.tilePieces} 片瓷砖，${totals.materials.tileBoxes} 箱，材料成本 ${money(totals.materials.totalMaterialCost)}，最终预计工期 ${fmt(duration.finalDuration, 1)} 天，风险等级 ${t(duration.riskLevel)}。`
        : `Tile Project Summary: ${fmt(totals.netArea)} m2 net tile area, ${totals.roomCount} rooms, ${totals.materials.tilePieces} tile pieces, ${totals.materials.tileBoxes} boxes, ${money(totals.materials.totalMaterialCost)} materials, ${fmt(duration.finalDuration, 1)} final estimated days, ${duration.riskLevel} risk.`;
      try {
        await navigator.clipboard.writeText(text);
        showToast(t("Summary copied."));
      } catch {
        showToast(t("Copy failed. Report text is available below."));
      }
    }

    function exportReport() {
      const blob = new Blob([generateReportText()], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "tile-installation-project-report.txt";
      a.click();
      URL.revokeObjectURL(url);
    }

    function showToast(message) {
      const toast = document.createElement("div");
      toast.className = "no-print fixed bottom-5 left-1/2 z-50 -translate-x-1/2 rounded-lg bg-slate-950 px-4 py-3 text-sm font-black text-white shadow-xl";
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 1800);
    }

    renderApp();
  </script>
</body>
</html>
